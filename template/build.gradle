plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.local.webviewtemplate'
    compileSdk 34

    defaultConfig {
        applicationId "com.apkcreator.tpl.pkg0000000000000000000000000000"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0.00000000000000"
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
