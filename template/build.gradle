plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.local.webviewtemplate'
    compileSdk 34

    defaultConfig {
        applicationId "com.apkcreator.tpl.pkg0000000000000000000000000000"
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName "1.0.0.00000000000000"
    }
    aaptOptions {
        cruncherEnabled = false
        noCompress 'png'
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Aucune dépendance externe lourde : léger, rapide et aucun PNG parasite dans res/ !
}
