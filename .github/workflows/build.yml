name: Build ApkCreator APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Default PNG Icons
        run: |
          python3 generate_icons.py

      - name: Build WebView Template APK & Bundle into ApkCreator Assets
        run: |
          gradle :template:assembleRelease
          mkdir -p app/src/main/assets
          cp template/build/outputs/apk/release/template-release-unsigned.apk app/src/main/assets/template_base.apk

      - name: Build ApkCreator APK
        run: |
          gradle :app:assembleDebug

      - name: Upload ApkCreator APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApkCreator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
